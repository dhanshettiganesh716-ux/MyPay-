<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MyPay</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f5f6f8;
 font-family:Arial,sans-serif;
 color:#111;
}

.app{
 max-width:430px;
 margin:auto;
 min-height:100vh;
 background:white;
 padding-bottom:80px;
}

header{
 padding:20px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 font-size:27px;
 font-weight:800;
}

.profile{
 width:42px;
 height:42px;
 border-radius:50%;
 background:#111;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
}

.balance{
 margin:0 18px;
 padding:22px;
 border-radius:20px;
 background:#111;
 color:white;
}

.small{
 font-size:13px;
 opacity:.7;
}

.money{
 font-size:30px;
 font-weight:bold;
 margin-top:8px;
}

.mainActions{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
 padding:18px;
}

.mainAction{
 background:#f5f5f5;
 border:0;
 border-radius:18px;
 padding:17px 5px;
 font-size:13px;
 cursor:pointer;
}

.icon{
 font-size:28px;
 margin-bottom:7px;
}

.section{
 padding:5px 18px 10px;
 font-size:19px;
 font-weight:bold;
}

.services{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
 padding:0 18px 18px;
}

.service{
 border:1px solid #e7e7e7;
 border-radius:16px;
 padding:15px 5px;
 text-align:center;
 cursor:pointer;
}

.serviceIcon{
 font-size:25px;
 margin-bottom:6px;
}

.serviceName{
 font-size:12px;
}

.ai{
 margin:0 18px 18px;
 padding:18px;
 border-radius:20px;
 background:#eeeeee;
 cursor:pointer;
}

.aiTitle{
 font-size:18px;
 font-weight:bold;
}

.aiText{
 color:#666;
 font-size:13px;
 margin-top:6px;
}

.more{
 margin:0 18px 20px;
 width:calc(100% - 36px);
 padding:15px;
 border:1px solid #ddd;
 background:white;
 border-radius:15px;
 font-weight:bold;
 cursor:pointer;
}

.bottom{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:100%;
 max-width:430px;
 background:white;
 border-top:1px solid #ddd;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 padding:9px 0;
}

.bottom button{
 border:0;
 background:white;
 font-size:12px;
}

.bottomIcon{
 font-size:21px;
}

#message{
 position:fixed;
 left:50%;
 transform:translateX(-50%);
 bottom:80px;
 width:90%;
 max-width:390px;
 background:#111;
 color:white;
 padding:14px;
 border-radius:12px;
 text-align:center;
 display:none;
}
</style>
</head>

<body>

<div class="app">

<header>
 <div class="logo">MyPay</div>
 <div class="profile">G</div>
</header>

<div class="balance">
 <div class="small">MyPay Balance</div>
 <div class="money">₹0.00</div>
 <div class="small">Demo account</div>
</div>

<!-- MAIN -->

<div class="mainActions">

<button class="mainAction" onclick="show('पैसे पाठवण्याचा पर्याय')">
 <div class="icon">📤</div>
 पैसे पाठवा
</button>

<button class="mainAction" onclick="show('पैसे घेण्याचा पर्याय')">
 <div class="icon">📥</div>
 पैसे घ्या
</button>

<button class="mainAction" onclick="show('QR Scanner पुढे जोडू')">
 <div class="icon">▣</div>
 QR Scan
</button>

</div>


<!-- RECHARGE -->

<div class="section">Recharge & Bills</div>

<div class="services">

<div class="service" onclick="show('Mobile Recharge')">
 <div class="serviceIcon">📱</div>
 <div class="serviceName">Mobile</div>
</div>

<div class="service" onclick="show('Electricity Bill')">
 <div class="serviceIcon">⚡</div>
 <div class="serviceName">Electricity</div>
</div>

<div class="service" onclick="show('DTH Recharge')">
 <div class="serviceIcon">📺</div>
 <div class="serviceName">DTH</div>
</div>

</div>


<!-- FINANCE -->

<div class="section">Finance</div>

<div class="services">

<div class="service" onclick="show('Insurance')">
 <div class="serviceIcon">🛡️</div>
 <div class="serviceName">Insurance</div>
</div>

<div class="service" onclick="show('Credit Card')">
 <div class="serviceIcon">💳</div>
 <div class="serviceName">Credit Card</div>
</div>

<div class="service" onclick="show('Investment')">
 <div class="serviceIcon">📈</div>
 <div class="serviceName">Investment</div>
</div>

</div>


<!-- AI -->

<div class="section">तुमचा AI Assistant</div>

<div class="ai" onclick="ai()">

<div class="aiTitle">🤖 MyPay AI</div>

<div class="aiText">
पैसे, खर्च, बिल किंवा saving बद्दल काहीही विचारा.
<button id="send" onclick="sendMessage()">➤</button>
</div>

</div>


<button class="more" onclick="allServices()">
सगळ्या सेवा पहा →
</button>


<!-- BOTTOM -->

<div class="bottom">

<button onclick="home()">
<div class="bottomIcon">🏠</div>
Home
</button>

<button onclick="show('QR Scanner पुढे जोडू')">
<div class="bottomIcon">▣</div>
Scan
</button>

<button onclick="ai()">
<div class="bottomIcon">🤖</div>
AI
</button>

<button onclick="show('Profile & Security')">
<div class="bottomIcon">👤</div>
Profile
</button>

</div>

</div>

<div id="message"></div>


<script>

function show(text){

let m=document.getElementById("message");

m.innerText=text;
m.style.display="block";

setTimeout(()=>{
m.style.display="none";
},2200);

}

function ai(){

show("🤖 नमस्कार! MyPay AI Assistant लवकरच जोडला जाईल.");

}

function allServices(){

show("सर्व Recharge, Bills आणि Finance services.");

}

function home(){

window.scrollTo({
top:0,
behavior:"smooth"
});

}

</script>

</body>
</html>
