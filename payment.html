<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MyPay Payment</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f5f5;
  font-family:Arial,sans-serif;
}

.header{
  background:#111;
  color:white;
  padding:20px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.container{
  padding:20px;
  max-width:430px;
  margin:auto;
}

.card{
  background:white;
  border-radius:20px;
  padding:25px;
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.avatar{
  width:65px;
  height:65px;
  border-radius:50%;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
  margin:0 auto 15px;
}

.name{
  text-align:center;
  font-size:19px;
  font-weight:bold;
}

.upi{
  text-align:center;
  color:#777;
  margin-top:7px;
  font-size:14px;
  word-break:break-all;
}

.label{
  margin-top:25px;
  font-size:14px;
  color:#555;
}

.amountInput{
  width:100%;
  border:none;
  border-bottom:2px solid #ddd;
  font-size:32px;
  padding:12px 5px;
  outline:none;
  text-align:center;
}

.amountInput:focus{
  border-bottom:2px solid #111;
}

.note{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:15px;
  outline:none;
}

.payButton{
  width:100%;
  margin-top:25px;
  padding:16px;
  border:none;
  border-radius:14px;
  background:#111;
  color:white;
  font-size:18px;
  font-weight:bold;
}

.payButton:active{
  transform:scale(0.98);
}

.message{
  display:none;
  margin-top:18px;
  padding:14px;
  background:#fff3cd;
  border-radius:12px;
  color:#664d03;
  font-size:14px;
  line-height:1.5;
}

.demo{
  text-align:center;
  color:#999;
  font-size:12px;
  margin-top:20px;
}

</style>

</head>


<body>

<div class="header">
  MyPay
</div>


<div class="container">

  <div class="card">

    <div class="avatar">
      M
    </div>


    <div
      class="name"
      id="personName">
      MyPay User
    </div>


    <div
      class="upi"
      id="upiId">
      demo@upi
    </div>


    <div class="label">
      Amount
    </div>


    <input
      id="amount"
      class="amountInput"
      type="number"
      inputmode="decimal"
      placeholder="₹0"
      min="1"
      step="0.01"
    >


    <div class="label">
      Note (optional)
    </div>


    <input
      id="note"
      class="note"
      type="text"
      placeholder="Food, Shopping..."
    >


    <button
      id="payButton"
      class="payButton"
      onclick="payNow()">
      Pay ₹0.00
    </button>


    <div
      id="message"
      class="message">
    </div>


    <div class="demo">
      MyPay Demo Payment
    </div>

  </div>

</div>


<script>

// -----------------------------
// QR मधून आलेली माहिती
// -----------------------------

const params =
  new URLSearchParams(
    window.location.search
  );


const upiId =
  params.get("upi") || "demo@upi";


const personName =
  params.get("name") || "MyPay User";


const qrAmount =
  params.get("amount") || "";


// -----------------------------
// माहिती दाखवा
// -----------------------------

document.getElementById("personName")
  .textContent = personName;


document.getElementById("upiId")
  .textContent = upiId;


// QR मध्ये amount असल्यास
if(qrAmount){

  document.getElementById("amount")
    .value = qrAmount;

}


// -----------------------------
// Button update
// -----------------------------

document.getElementById("amount")
  .addEventListener(
    "input",
    updatePayButton
  );


function updatePayButton(){

  const amount =
    parseFloat(
      document.getElementById("amount").value
    );


  const button =
    document.getElementById("payButton");


  if(!amount || amount <= 0){

    button.textContent =
      "Pay ₹0.00";

    return;

  }


  button.textContent =
    "Pay ₹" +
    amount.toFixed(2);

}


// -----------------------------
// Payment
// -----------------------------

function payNow(){

  const amount =
    parseFloat(
      document.getElementById("amount").value
    );


  const note =
    document.getElementById("note")
      .value
      .trim();


  const message =
    document.getElementById("message");


  message.style.display = "none";


  // Amount check
  if(!amount || amount <= 0){

    message.textContent =
      "कृपया आधी amount टाका.";

    message.style.display =
      "block";

    return;

  }


  // UPI ID check
  if(
    !upiId ||
    upiId === "demo@upi"
  ){

    message.textContent =
      "Valid UPI ID मिळाली नाही. कृपया QR पुन्हा scan करा.";

    message.style.display =
      "block";

    return;

  }


  // -----------------------------
  // UPI URL तयार करा
  // -----------------------------

  let upiUrl =
    "upi://pay" +
    "?pa=" +
    encodeURIComponent(upiId) +
    "&pn=" +
    encodeURIComponent(personName) +
    "&am=" +
    encodeURIComponent(
      amount.toFixed(2)
    ) +
    "&cu=INR";


  if(note){

    upiUrl +=
      "&tn=" +
      encodeURIComponent(note);

  }


  console.log(
    "UPI URL:",
    upiUrl
  );


  // -----------------------------
  // Android UPI app launch
  // -----------------------------

  const intentUrl =
    "intent://pay" +
    "?pa=" +
    encodeURIComponent(upiId) +
    "&pn=" +
    encodeURIComponent(personName) +
    "&am=" +
    encodeURIComponent(
      amount.toFixed(2)
    ) +
    "&cu=INR" +
    (note
      ? "&tn=" +
        encodeURIComponent(note)
      : ""
    ) +
    "#Intent;" +
    "scheme=upi;" +
    "action=android.intent.action.VIEW;" +
    "category=android.intent.category.BROWSABLE;" +
    "end";


  try{

    window.location.href =
      intentUrl;


    setTimeout(function(){

      message.textContent =
        "UPI app उघडला नाही. जर तुम्ही SPCK Preview मध्ये test करत असाल तर त्याचा WebView UPI app launch करू शकत नाही. MyPay ला Android browser/app मध्ये उघडून पुन्हा प्रयत्न करा.";

      message.style.display =
        "block";

    },2000);


  }catch(error){

    console.log(error);

    message.textContent =
      "UPI app सुरू करता आला नाही.";

    message.style.display =
      "block";

  }

}

</script>

</body>

</html>
