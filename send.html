<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyPay - पैसे पाठवा</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f6f8;
  font-family:Arial,sans-serif;
  color:#111;
}

.app{
  max-width:430px;
  min-height:100vh;
  margin:auto;
  background:white;
  padding-bottom:30px;
}

.header{
  background:#111;
  color:white;
  padding:20px;
  font-size:22px;
  font-weight:bold;
}

.container{
  padding:20px;
}

.card{
  background:#f5f5f5;
  border-radius:20px;
  padding:20px;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

input{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-bottom:18px;
  outline:none;
}

input:focus{
  border-color:#111;
}

.payButton{
  width:100%;
  padding:16px;
  border:0;
  border-radius:14px;
  background:#111;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.backButton{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:1px solid #ddd;
  border-radius:14px;
  background:white;
  font-size:15px;
  cursor:pointer;
}

#message{
  margin-top:18px;
  padding:14px;
  border-radius:12px;
  background:#eee;
  display:none;
  text-align:center;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    पैसे पाठवा 💸
  </div>

  <div class="container">

    <div class="card">

      <label>Mobile Number or UPI ID</label>

<input
  type="text"
  id="upi"
  placeholder="Enter Mobile Number or UPI ID"
  autocomplete="off"
>

      <label>Amount</label>

      <input
        type="number"
        id="amount"
        placeholder="₹ Amount"
        min="1"
        inputmode="decimal"
      >

      <label>Note (Optional)</label>

      <input
        type="text"
        id="note"
        placeholder="उदा. Food, Shopping..."
      >

      <button class="payButton" onclick="sendMoney()">
        पैसे पाठवा
      </button>

      <button class="backButton" onclick="goHome()">
        ← Home वर जा
      </button>

      <div id="message"></div>

    </div>

  </div>

</div>


<script>

const params = new URLSearchParams(window.location.search);

const selectedUpi = params.get("upi");

if(selectedUpi){
  document.getElementById("upi").value = selectedUpi;
}

function sendMoney(){

  const upi =
    document.getElementById("upi").value.trim();

  const amount =
    document.getElementById("amount").value.trim();

  const note =
    document.getElementById("note").value.trim();


  if(upi === ""){

    showMessage("कृपया Mobile Number or UPI ID टाका.");

    return;
  }


  if(amount === "" || Number(amount) <= 0){

    showMessage("कृपया योग्य Amount टाका.");

    return;
  }


  const upiUrl =
    "upi://pay" +
    "?pa=" + encodeURIComponent(upi) +
    "&am=" + encodeURIComponent(amount) +
    "&cu=INR" +
    "&tn=" + encodeURIComponent(note);

showMessage("Payment app उघडत आहे... 💸");

setTimeout(function(){
  window.location.href = upiUrl;
}, 800);
  window.location.href = upiUrl;

}


function showMessage(text){

  const message =
    document.getElementById("message");

  message.innerText = text;

  message.style.display = "block";

}


function goHome(){

  window.location.href = "index.html";

}

</script>

</body>
  </html>
